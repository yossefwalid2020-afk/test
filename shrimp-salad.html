<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruby's - سلطة الجمبري</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root{
    --ink:#2b1d14;
    --paper:#f7ecd9;
    --card:#eee0c4;
    --red:#c1392b;
    --black:#1c1815;
    --gold:#c9a227;
    --line: rgba(43,29,20,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 10% 6%, rgba(201,162,39,0.14), transparent 38%),
      radial-gradient(circle at 92% 85%, rgba(193,57,43,0.10), transparent 42%),
      var(--paper);
    color:var(--ink);
    font-family:'Cairo', Tahoma, sans-serif;
    display:flex; justify-content:center;
    padding:0 0 60px;
  }
  .ticket{ width:100%; max-width:460px; }

  .hero{
    position:relative; height:280px; overflow:hidden;
    border-radius:0 0 26px 26px;
  }
  .hero img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .hero::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(28,24,21,0.85) 5%, rgba(28,24,21,0.15) 55%, transparent 80%);
  }
  .badge{
    position:absolute; top:16px; right:16px; z-index:2;
    background:var(--black); color:#fff; border-radius:50%;
    width:64px; height:64px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    border:2px solid var(--red);
  }
  .badge b{ font-size:14px; line-height:1; }
  .badge span{ font-size:6px; letter-spacing:.3px; margin-top:2px; opacity:.85; }

  .hero-text{
    position:absolute; bottom:16px; right:20px; left:20px; z-index:2; color:#fff;
  }
  .hero-text p.tag{
    font-size:12px; letter-spacing:.4px; color:#e7c98a; margin:0 0 4px;
  }
  .hero-text h1{
    font-family:'Markazi Text', serif; font-weight:700; font-size:34px; margin:0;
  }

  .body-wrap{ padding:22px 18px 0; }

  .tags{ display:flex; justify-content:center; gap:8px; margin:14px 0 6px; }
  .tag-pill{
    font-size:12px; padding:4px 10px; border-radius:20px; font-weight:600;
    display:inline-flex; align-items:center; gap:4px;
  }
  .tag-pill.grill{ background:rgba(193,57,43,0.12); color:var(--red); }
  .tag-pill.house{ background:rgba(201,162,39,0.18); color:#8a6c14; }

  p.note{
    text-align:center; font-size:14px; color:rgba(43,29,20,0.65); max-width:320px;
    margin:0 auto 22px;
  }

  .card{
    background:var(--card); border-radius:20px; padding:20px 18px 24px;
    box-shadow: 0 16px 30px -18px rgba(43,29,20,0.5);
    border:1px solid var(--line); position:relative;
  }

  model-viewer{
    width:100%; height:270px; border-radius:14px;
    background: radial-gradient(ellipse at center, rgba(43,29,20,0.08), transparent 70%), var(--paper);
  }

  #ar-button{
    display:block; width:100%; margin-top:14px; background:var(--red); color:#fff;
    border:none; border-radius:10px; padding:14px; font-family:'Cairo', sans-serif;
    font-weight:700; font-size:16px; cursor:pointer;
  }

  .tear{
    height:22px; margin:24px -18px -24px;
    background: radial-gradient(circle 11px at 22px 0, transparent 10px, var(--paper) 11px) top/44px 22px repeat-x;
  }

  .qr-block{ text-align:center; padding-top:24px; }
  .qr-block p{ font-size:14px; margin:0 0 4px; color:rgba(43,29,20,0.75); }
  .qr-block p.small{ font-size:12px; color:rgba(43,29,20,0.55); margin-bottom:12px; }

  #qrcode{ display:inline-block; background:#fff; padding:10px; border-radius:10px; border:1px solid var(--line); }

  input{
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-family:'Cairo', sans-serif; font-size:13px; color:var(--ink);
    margin-bottom:14px;
  }
  input:focus{ outline:2px solid var(--gold); }

  .signature{
    text-align:center; margin-top:22px; font-size:12px; letter-spacing:.5px;
    color:rgba(43,29,20,0.55);
  }
</style>
</head>
